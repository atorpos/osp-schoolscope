name: schoolscope
services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      PGHOST: ${RDS_HOST:?Set RDS_HOST in .env.rds}
      PGPORT: ${RDS_PORT:-5432}
      PGUSER: ${RDS_USER:?Set RDS_USER in .env.rds}
      PGPASSWORD: ${RDS_PASSWORD:?Set RDS_PASSWORD in .env.rds}
      PGDATABASE: ${RDS_DATABASE:?Set RDS_DATABASE in .env.rds}
      PGSSLMODE: verify-full
      NODE_EXTRA_CA_CERTS: /certs/rds-ca-bundle.pem
    volumes:
      - type: bind
        source: ./certs/rds-ca-bundle.pem
        target: /certs/rds-ca-bundle.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [internal]

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3008}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    driver: bridge
