name: schoolscope
services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      SQLITE_PATH: /app/storage/schoolscope.sqlite
      # Reviewer accounts and login settings (see README → "Reviewer accounts")
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      # Apple Maps (see README → "Apple Maps"); without them the map is drawn without MapKit
      MAPKIT_TEAM_ID: ${MAPKIT_TEAM_ID:-}
      MAPKIT_KEY_ID: ${MAPKIT_KEY_ID:-}
      MAPKIT_PRIVATE_KEY: ${MAPKIT_PRIVATE_KEY:-}
      MAPKIT_ORIGIN: ${MAPKIT_ORIGIN:-}
    volumes:
      - sqlite_data:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [internal]

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3008}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  sqlite_data:

networks:
  internal:
    driver: bridge
