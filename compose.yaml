name: schoolscope
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schoolscope}
      POSTGRES_USER: ${POSTGRES_USER:-schoolscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      PGHOST: database
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-schoolscope}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      PGDATABASE: ${POSTGRES_DB:-schoolscope}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [internal]

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3008}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
